name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "8 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Bicep (compile all modules to ARM)
        run: |
          az bicep install
          az bicep build --file bicep/main.bicep
      - name: Lint Bicep
        run: az bicep lint --file bicep/main.bicep
